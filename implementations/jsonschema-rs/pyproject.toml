[project]
name = "jsonschema-rs-benchmark"
version = "0.1.0"
description = "jsonschema-rs, the Python bindings of the jsonschema Rust crate, for jsonschema-benchmark"
requires-python = ">=3.13"
# The latest release: the Dockerfile upgrades it in uv.lock on every build (keeping the other dependencies locked)
# and records it in /app/jsonschema-rs-version for version.sh.
dependencies = ["jsonschema-rs>=0.58.6"]

[tool.uv]
package = false
