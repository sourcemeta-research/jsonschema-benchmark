#cloud-config
# A jsonschema-benchmark runner VM: Docker and the tools the benchmark's Makefile and workflow use, and the GitHub
# Actions runner, installed but not registered. The benchmark workflow registers a runner for each scheduled run and
# removes it afterwards (see README.md).
package_update: true
package_upgrade: true
packages:
  - docker.io
  - make
  - jq
  - git
  - curl
  - unzip
  - python3
  - python3-venv
  - pipx
  - time

users:
  - default
  - name: runner
    shell: /bin/bash
    groups: [docker]

runcmd:
  - systemctl enable --now docker
  - mkdir -p /opt/actions-runner
  - >-
    version=$(curl -sSfL https://api.github.com/repos/actions/runner/releases/latest | jq -r .tag_name | sed 's/^v//')
    && curl -sSfL "https://github.com/actions/runner/releases/download/v${version}/actions-runner-linux-x64-${version}.tar.gz"
    | tar -xz -C /opt/actions-runner
  - /opt/actions-runner/bin/installdependencies.sh
  - chown -R runner:runner /opt/actions-runner
